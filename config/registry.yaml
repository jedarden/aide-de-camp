argocd:
  auth: none
  base_url: https://argocd-ro-ardenone-manager-ts.ardenone.com:8444
clusters:
  apexalgo-iad:
    proxy: http://traefik-apexalgo-iad:8001
    type: proxy
  ardenone-cluster:
    proxy: http://traefik-ardenone-cluster:8001
    type: proxy
  ardenone-manager:
    proxy: http://traefik-ardenone-manager:8001
    type: proxy
  iad-kalshi:
    proxy: http://kubectl-proxy-iad-kalshi:8001
    type: proxy
  rs-manager:
    proxy: http://traefik-rs-manager:8001
    type: proxy
global_aliases:
  prod: options-pipeline
  staging: options-pipeline
  the feed: options-pipeline
projects:
  aide-de-camp:
    aliases:
    - adc
    - aide-de-camp
    - this interface
    cluster: null
    description: aide-de-camp itself (this interface)
    intent_support:
    - status
    - self-modification
    - brainstorm
    namespace: null
    repo_path: /home/coding/aide-de-camp
    workflows:
      status:
        steps:
        - git_log
        - open_beads
  declarative-config:
    aliases:
    - declarative-config
    - gitops
    - k8s config
    cluster: null
    description: Kubernetes declarative configuration (GitOps)
    intent_support:
    - status
    - action
    namespace: null
    repo_path: /home/coding/declarative-config
    workflows:
      status:
        steps:
        - git_log
        - argocd_apps
  kalshi-tape:
    aliases:
    - kalshi
    - kalshi tape
    - tape
    cluster: iad-kalshi
    description: Kalshi market data tape service on iad-kalshi
    intent_support:
    - status
    - action
    namespace: default
    repo_path: null
    workflows:
      deploy:
        steps:
        - pod_status
        - ci_status
  pbx-web:
    aliases:
    - pbx
    - pbx web
    - phone system
    - telephony
    argocd_app: pbx-web
    cluster: ardenone-cluster
    description: PBX web interface on ardenone-cluster
    intent_support:
    - status
    - lookup
    - brainstorm
    - task-profile
    namespace: pbx-web
    repo_path: /home/coding/declarative-config
    workflows:
      status:
        steps:
        - pod_status
        - deployment_info
  whisper-stt:
    aliases:
    - whisper
    - stt
    - speech-to-text
    - whisper stt
    argocd_app: whisper-stt
    cluster: ardenone-cluster
    description: Whisper STT service on ardenone-cluster
    intent_support:
    - status
    - brainstorm
    - lookup
    - task-profile
    namespace: whisper-stt
    repo_path: /home/coding/declarative-config
    workflows:
      deploy:
        steps:
        - ci_status
        - image_tag
        - argocd_sync
        - pod_status
      diagnose:
        steps:
        - pod_status
        - pod_logs
        - argocd_events
