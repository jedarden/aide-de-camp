# Time Step Granularity Configuration for whisper-stt Latency Aggregation
# Task: adc-1e1j1
# Created: 2026-08-06

# Recommended configuration for 30-day latency aggregation
default:
  step: "1h"  # 1-hour granularity for optimal balance of detail and performance
  window_days: 30  # Standard analysis window

  # Result estimates (based on actual data analysis: 97,398 events over 660 hours = 147.55 events/hour)
  estimated_data_points: 720  # 30 days × 24 hours ÷ 1 hour
  estimated_entries_per_bucket: 148  # ~147.55 events/hour (actual measured rate)
  query_performance: "good"  # Fast query execution with <1000 data points
  statistical_significance: "high"  # Robust statistics with ~148 samples per bucket
  granularity: "high"  # Finest granularity that meets manageability targets

# Alternative granularities for specific use cases
alternatives:
  balanced_performance:
    step: "6h"
    use_case: "Balanced performance with reduced data points"
    estimated_data_points: 120  # 30 days × 24 hours ÷ 6 hours
    estimated_entries_per_bucket: 885  # 6h × ~147.55 events/hour
    performance: "excellent"  # Faster queries with fewer buckets
    significance: "high"  # Very robust statistics with ~885 samples
    recommendation: "Use for faster queries when hourly detail is not critical"

  high_level_trends:
    step: "1d"
    use_case: "High-level daily trends and reporting"
    estimated_data_points: 30
    estimated_entries_per_bucket: 3512
    performance: "excellent"
    significance: "high"
    recommendation: "Use for executive dashboards and long-term patterns"

  fine_grained:
    step: "15m"
    use_case: "Fine-grained analysis of short periods"
    estimated_data_points: 2880
    estimated_entries_per_bucket: 36
    performance: "slow"
    significance: "medium"
    recommendation: "Only for specific time ranges (<7 days)"

# Step parameter format for VictoriaLogs queries
step_format:
  description: "VictoriaLogs step parameter format: <value><unit>"
  units:
    s: "seconds"
    m: "minutes"
    h: "hours"
    d: "days"
  examples:
    - "30s - 30 seconds"
    - "5m - 5 minutes"
    - "1h - 1 hour"
    - "6h - 6 hours"
    - "1d - 1 day"

# Data volume metrics (from actual whisper-stt logs analyzed 2026-08-07)
data_metrics:
  total_entries_analyzed: 97398  # Total valid timestamps extracted
  time_span_hours: 660.11  # Actual data span in hours
  time_span_days: 27.5  # ~27.5 days of actual data
  average_entries_per_hour: 147.55  # Actual measured event rate
  average_entries_per_minute: 2.46  # For fine-grained analysis
  actual_hours_with_data: 205  # Hours containing at least one event
  data_collection_period: "2026-07-10T17:39:33Z to 2026-08-07T05:46:12Z"
  analysis_date: "2026-08-07"

# Query templates with step configuration
query_templates:
  # Recommended 6-hour granularity
  standard_6h:
    template: '{namespace="whisper-stt"} |= "duration" | stats avg(duration) by (_time, 6h)'
    time_range: "@now()-30d -> @now()"
    step: "6h"

  # 1-hour detailed analysis
  detailed_1h:
    template: '{namespace="whisper-stt"} | json | stats avg(processing_time) by (_time, 1h)'
    time_range: "@now()-7d -> @now()"
    step: "1h"

  # 1-day high-level trends
  daily_1d:
    template: '{namespace="whisper-stt"} | json | quantile_over_time(0.95, duration) by (_time, 1d)'
    time_range: "@now()-30d -> @now()"
    step: "1d"

# Performance guidelines
performance_guidelines:
  max_data_points: 1000  # Maximum recommended for visualization and query performance
  optimal_range: [100, 1000]  # Optimal range for 30-day aggregation
  min_samples_per_bucket: 30  # Minimum for statistical significance
  target_buckets_30day: 720  # Target for 1-hour granularity (30 days × 24 hours)
  max_acceptable_buckets: 1000  # Upper limit for manageability

# Decision matrix (based on actual data analysis)
decision_matrix:
  optimal_balance:
    recommended_step: "1h"
    reasoning: "Highest granularity that meets all targets (<1000 buckets, >30 samples/bucket, good performance)"

  performance_priority:
    recommended_step: "6h"
    reasoning: "Faster queries with fewer buckets (120) when hourly detail is not required"

  statistical_robustness:
    recommended_step: "1d"
    reasoning: "Maximum samples per bucket (~3,541) for robust statistics, minimal buckets (30)"

  analysis_basis:
    data_points_analyzed: 97398
    event_rate_measured: "147.55 events/hour"
    analysis_method: "Actual timestamp extraction from whisper-stt-raw.jsonl"
    recommendation_algorithm: "Highest granularity meeting <1000 buckets target"
