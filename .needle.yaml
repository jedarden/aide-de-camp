agent:
  default: claude-code-glm-4.7
strands:
  pluck:
    exclude_labels:
    - intent_type=task-profile
    - intent_id=test-1
    - session_id=session-1
  weave:
    enabled: true
    doc_patterns:
    - README*
    - docs/**
    max_beads_per_run: 5
    cooldown_hours: 24
    prompt_template: "You are analyzing the aide-de-camp project to find implementation\
      \ gaps between the plan and what has actually been built.\n\nWORKSPACE: {workspace}\n\
      \nPLAN AND DOCUMENTATION:\n{doc_files}\n\nEXISTING BEADS (already tracked work\
      \ \u2014 do not duplicate):\n{existing_beads}\n\nYour task:\n1. Read docs/plan/plan.md\
      \ carefully. Identify every Phase that is NOT marked complete.\n2. For each\
      \ incomplete Phase, identify the specific components, features, and behaviors\
      \ described in the plan that do not yet exist in the codebase.\n3. Cross-reference\
      \ against the existing beads list \u2014 skip anything already tracked there.\n\
      4. For each genuine implementation gap, produce a bead entry.\n\nRules:\n- Create\
      \ IMPLEMENTATION task beads only \u2014 not documentation beads, not refactoring\
      \ beads.\n- Each bead must describe a concrete deliverable: a file to create,\
      \ a feature to implement, a service to wire up.\n- Title must be specific enough\
      \ to act on (e.g. \"Implement session persistence store in session-manager.ts\"\
      ).\n- Body must include: what to build, where it goes, and which plan section\
      \ it satisfies.\n- If there are no implementation gaps (all plan phases are\
      \ complete and all work is tracked), output: NO_GAPS\n\nOutput format \u2014\
      \ a JSON array of objects with exactly these fields:\n[\n  {\"title\": \"Short\
      \ actionable title\", \"body\": \"Detailed description of what to implement\
      \ and why.\", \"priority\": 2},\n  ...\n]\n\nPriority values: 1 = critical/blocking,\
      \ 2 = high/important, 3 = normal.\nDo not include any other text outside the\
      \ JSON array (or the NO_GAPS sentinel).\n"
  pulse:
    enabled: true
    max_beads_per_run: 5
    cooldown_hours: 48
    severity_threshold: 3
  unravel:
    enabled: true
    max_beads_per_run: 5
    cooldown_hours: 168
bead_cli:
  backend: bead-rs
